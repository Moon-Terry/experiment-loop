<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 444" width="1100" height="444" role="img" aria-label="One iteration of the loop: the director designs and plans, the experimenter performs, the driver evaluates, the director validates and decides, and the driver saves or restores the best state before the next iteration.">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.ground { fill: #ffffff; stroke: #e5e5ea; }

.box { fill: #ffffff; stroke: #c7c7cc; stroke-width: 1.2; }
.box-soft { fill: #e5e5ea; stroke: #c7c7cc; stroke-width: 1.2; }
.box-accent { fill: #e5f1ff; stroke: #007aff; stroke-width: 1.6; }
.box-ghost { fill: none; stroke: #c7c7cc; stroke-width: 1.2; stroke-dasharray: 4 3; }
.rule { stroke: #e5e5ea; stroke-width: 1; }
.edge { fill: none; stroke: #6e6e73; stroke-width: 1.4; }
.edge-accent { fill: none; stroke: #007aff; stroke-width: 2.2; }
.head { fill: #6e6e73; }
.head-accent { fill: #007aff; }
.t { fill: #1d1d1f; font-size: 13px; }
.t-strong { fill: #1d1d1f; font-size: 13px; font-weight: 600; }
.t-muted { fill: #6e6e73; font-size: 11.5px; }
.t-accent { fill: #007aff; font-size: 11.5px; font-weight: 600; }
.t-title { fill: #1d1d1f; font-size: 14px; font-weight: 600; }
.badge { fill: #ffffff; stroke: #6e6e73; stroke-width: 1.2; }
.t-badge { fill: #1d1d1f; font-size: 11px; font-weight: 600; }

@media (prefers-color-scheme: dark) {
.ground { fill: #1c1c1e; stroke: #2c2c2e; }

.box { fill: #1c1c1e; stroke: #48484a; stroke-width: 1.2; }
.box-soft { fill: #2c2c2e; stroke: #48484a; stroke-width: 1.2; }
.box-accent { fill: #0b2a4a; stroke: #0a84ff; stroke-width: 1.6; }
.box-ghost { fill: none; stroke: #48484a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.rule { stroke: #2c2c2e; stroke-width: 1; }
.edge { fill: none; stroke: #98989d; stroke-width: 1.4; }
.edge-accent { fill: none; stroke: #0a84ff; stroke-width: 2.2; }
.head { fill: #98989d; }
.head-accent { fill: #0a84ff; }
.t { fill: #f2f2f7; font-size: 13px; }
.t-strong { fill: #f2f2f7; font-size: 13px; font-weight: 600; }
.t-muted { fill: #98989d; font-size: 11.5px; }
.t-accent { fill: #0a84ff; font-size: 11.5px; font-weight: 600; }
.t-title { fill: #f2f2f7; font-size: 14px; font-weight: 600; }
.badge { fill: #1c1c1e; stroke: #98989d; stroke-width: 1.2; }
.t-badge { fill: #f2f2f7; font-size: 11px; font-weight: 600; }
}
</style>
<rect class="ground" x="0.5" y="0.5" width="1099" height="443" rx="12"/>
<defs><marker id="la" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,0 L8,4 L0,8 z"/></marker><marker id="lb" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="head-accent" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<line class="rule" x1="20" y1="96" x2="1080" y2="96"/>
<line class="rule" x1="20" y1="196" x2="1080" y2="196"/>
<line class="rule" x1="20" y1="296" x2="1080" y2="296"/>
<text class="t-strong" x="20" y="54">Sources</text><text class="t-muted" x="20" y="70">outside the loop</text>
<text class="t-strong" x="20" y="142">Director</text><text class="t-muted" x="20" y="158">model, no shell</text>
<text class="t-strong" x="20" y="242">Experimenter</text><text class="t-muted" x="20" y="258">second model</text>
<text class="t-strong" x="20" y="342">Driver</text><text class="t-muted" x="20" y="358">program</text>
<rect class="box-ghost" x="135" y="40" width="460" height="36" rx="8"/>
<text class="t" x="365" y="63" text-anchor="middle">top-tier papers · official code · industry-lab settings</text>
<line class="edge" x1="205" y1="76" x2="205" y2="115" marker-end="url(#la)"/>
<text class="t-muted" x="213" y="90">opens, quotes</text>
<line class="edge" x1="525" y1="76" x2="525" y2="215" marker-end="url(#la)"/>
<text class="t-muted" x="533" y="90">re-checks</text>
<rect class="box" x="135" y="116" width="140" height="60" rx="8"/>
<text class="t-strong" x="205" y="142" text-anchor="middle">Design</text>
<text class="t-muted" x="205" y="160" text-anchor="middle">diagnose, choose idea</text>
<circle class="badge" cx="153" cy="137" r="10"/>
<text class="t-badge" x="153" y="141" text-anchor="middle">1</text>
<rect class="box" x="295" y="116" width="140" height="60" rx="8"/>
<text class="t-strong" x="365" y="142" text-anchor="middle">Plan</text>
<text class="t-muted" x="365" y="160" text-anchor="middle">one change, prediction</text>
<circle class="badge" cx="313" cy="137" r="10"/>
<text class="t-badge" x="313" y="141" text-anchor="middle">2</text>
<rect class="box" x="455" y="216" width="140" height="60" rx="8"/>
<text class="t-strong" x="525" y="242" text-anchor="middle">Perform</text>
<text class="t-muted" x="525" y="260" text-anchor="middle">edit code, smoke test</text>
<circle class="badge" cx="473" cy="237" r="10"/>
<text class="t-badge" x="473" y="241" text-anchor="middle">3</text>
<rect class="box" x="615" y="316" width="140" height="60" rx="8"/>
<text class="t-strong" x="685" y="342" text-anchor="middle">Evaluate</text>
<text class="t-muted" x="685" y="360" text-anchor="middle">run seeds, read metric</text>
<circle class="badge" cx="633" cy="337" r="10"/>
<text class="t-badge" x="633" y="341" text-anchor="middle">4</text>
<rect class="box" x="775" y="116" width="140" height="60" rx="8"/>
<text class="t-strong" x="845" y="142" text-anchor="middle">Validate</text>
<text class="t-muted" x="845" y="160" text-anchor="middle">is the result real?</text>
<circle class="badge" cx="793" cy="137" r="10"/>
<text class="t-badge" x="793" y="141" text-anchor="middle">5</text>
<rect class="box" x="935" y="116" width="140" height="60" rx="8"/>
<text class="t-strong" x="1005" y="142" text-anchor="middle">Decide</text>
<text class="t-muted" x="1005" y="160" text-anchor="middle">KEEP or DISCARD</text>
<circle class="badge" cx="953" cy="137" r="10"/>
<text class="t-badge" x="953" y="141" text-anchor="middle">6</text>
<rect class="box-accent" x="935" y="316" width="140" height="60" rx="8"/>
<text class="t-strong" x="1005" y="342" text-anchor="middle">Best state</text>
<text class="t-muted" x="1005" y="360" text-anchor="middle">save or restore</text>
<line class="edge" x1="275" y1="146" x2="294" y2="146" marker-end="url(#la)"/>
<polyline class="edge" points="365,176 365,246 454,246" marker-end="url(#la)"/>
<text class="t-muted" x="410" y="238" text-anchor="middle">plan.md</text>
<polyline class="edge" points="595,246 685,246 685,315" marker-end="url(#la)"/>
<text class="t-muted" x="693" y="268">report.md</text><text class="t-muted" x="693" y="283">change.patch</text>
<polyline class="edge" points="755,346 845,346 845,177" marker-end="url(#la)"/>
<text class="t-muted" x="853" y="250">metrics.json</text><text class="t-muted" x="853" y="265">run logs</text>
<line class="edge" x1="915" y1="146" x2="934" y2="146" marker-end="url(#la)"/>
<line class="edge-accent" x1="1005" y1="176" x2="1005" y2="314" marker-end="url(#lb)"/>
<text class="t-accent" x="1013" y="250">verdict.md</text>
<polyline class="edge-accent" points="1005,376 1005,410 205,410 205,178" marker-end="url(#lb)"/>
<text class="t-accent" x="605" y="402" text-anchor="middle">next iteration starts from the best state</text>
<text class="t-muted" x="605" y="430" text-anchor="middle">until the target, the budget or the patience limit is reached</text>
</svg>
