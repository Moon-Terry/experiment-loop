<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="Decision flow for choosing a usage case: a running loop leads to case 04; a table not fixed in advance leads to case 01; a fixed table with open method ranges leads to case 03; otherwise case 02.">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.ground { fill: #ffffff; stroke: #e5e5ea; }

.box { fill: #ffffff; stroke: #c7c7cc; stroke-width: 1.2; }
.box-soft { fill: #e5e5ea; stroke: #c7c7cc; stroke-width: 1.2; }
.box-accent { fill: #e5f1ff; stroke: #007aff; stroke-width: 1.6; }
.box-ghost { fill: none; stroke: #c7c7cc; stroke-width: 1.2; stroke-dasharray: 4 3; }
.rule { stroke: #e5e5ea; stroke-width: 1; }
.edge { fill: none; stroke: #6e6e73; stroke-width: 1.4; }
.edge-accent { fill: none; stroke: #007aff; stroke-width: 2.2; }
.head { fill: #6e6e73; }
.head-accent { fill: #007aff; }
.t { fill: #1d1d1f; font-size: 13px; }
.t-strong { fill: #1d1d1f; font-size: 13px; font-weight: 600; }
.t-muted { fill: #6e6e73; font-size: 11.5px; }
.t-accent { fill: #007aff; font-size: 11.5px; font-weight: 600; }
.t-title { fill: #1d1d1f; font-size: 14px; font-weight: 600; }
.badge { fill: #ffffff; stroke: #6e6e73; stroke-width: 1.2; }
.t-badge { fill: #1d1d1f; font-size: 11px; font-weight: 600; }

@media (prefers-color-scheme: dark) {
.ground { fill: #1c1c1e; stroke: #2c2c2e; }

.box { fill: #1c1c1e; stroke: #48484a; stroke-width: 1.2; }
.box-soft { fill: #2c2c2e; stroke: #48484a; stroke-width: 1.2; }
.box-accent { fill: #0b2a4a; stroke: #0a84ff; stroke-width: 1.6; }
.box-ghost { fill: none; stroke: #48484a; stroke-width: 1.2; stroke-dasharray: 4 3; }
.rule { stroke: #2c2c2e; stroke-width: 1; }
.edge { fill: none; stroke: #98989d; stroke-width: 1.4; }
.edge-accent { fill: none; stroke: #0a84ff; stroke-width: 2.2; }
.head { fill: #98989d; }
.head-accent { fill: #0a84ff; }
.t { fill: #f2f2f7; font-size: 13px; }
.t-strong { fill: #f2f2f7; font-size: 13px; font-weight: 600; }
.t-muted { fill: #98989d; font-size: 11.5px; }
.t-accent { fill: #0a84ff; font-size: 11.5px; font-weight: 600; }
.t-title { fill: #f2f2f7; font-size: 14px; font-weight: 600; }
.badge { fill: #1c1c1e; stroke: #98989d; stroke-width: 1.2; }
.t-badge { fill: #f2f2f7; font-size: 11px; font-weight: 600; }
}
</style>
<rect class="ground" x="0.5" y="0.5" width="1099" height="329" rx="12"/>
<defs><marker id="ma" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0,0 L8,4 L0,8 z"/></marker><marker id="mb" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="head-accent" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<text class="t-title" x="20" y="28">Which usage case?</text>
<text class="t-muted" x="20" y="47">answer from left to right; each end names the file to read</text>
<rect class="box-ghost" x="20" y="145" width="110" height="56" rx="8"/>
<text class="t-strong" x="75.0" y="168" text-anchor="middle">You</text>
<text class="t-muted" x="75.0" y="186" text-anchor="middle">have a request</text>
<rect class="box-soft" x="180" y="138" width="170" height="70" rx="8"/>
<text class="t-strong" x="265.0" y="168" text-anchor="middle">A loop is</text>
<text class="t-strong" x="265.0" y="186" text-anchor="middle">already running?</text>
<rect class="box-soft" x="420" y="138" width="190" height="70" rx="8"/>
<text class="t-strong" x="515.0" y="168" text-anchor="middle">Is the table fixed</text>
<text class="t-strong" x="515.0" y="186" text-anchor="middle">before any result?</text>
<rect class="box-soft" x="680" y="138" width="190" height="70" rx="8"/>
<text class="t-strong" x="775.0" y="168" text-anchor="middle">Does your method still</text>
<text class="t-strong" x="775.0" y="186" text-anchor="middle">have open ranges?</text>
<rect class="box-accent" x="420" y="62" width="190" height="52" rx="8"/>
<text class="t-strong" x="515.0" y="83" text-anchor="middle">04 check, extend, stop</text>
<text class="t-muted" x="515.0" y="101" text-anchor="middle">either mode</text>
<rect class="box-accent" x="680" y="240" width="190" height="56" rx="8"/>
<text class="t-strong" x="775.0" y="263" text-anchor="middle">01 overnight search</text>
<text class="t-muted" x="775.0" y="281" text-anchor="middle">search for a better setting</text>
<rect class="box-accent" x="920" y="62" width="160" height="56" rx="8"/>
<text class="t-strong" x="1000.0" y="85" text-anchor="middle">03 tune then freeze</text>
<text class="t-muted" x="1000.0" y="103" text-anchor="middle">search, then matrix</text>
<rect class="box-accent" x="920" y="240" width="160" height="56" rx="8"/>
<text class="t-strong" x="1000.0" y="263" text-anchor="middle">02 fixed comparison</text>
<text class="t-muted" x="1000.0" y="281" text-anchor="middle">matrix</text>
<path class="edge" d="M130,173 L178,173" marker-end="url(#ma)"/>
<path class="edge" d="M265,138 L265,88 L418,88" marker-end="url(#ma)"/>
<text class="t-accent" x="275" y="110">yes</text>
<path class="edge" d="M350,173 L418,173" marker-end="url(#ma)"/>
<text class="t-accent" x="372" y="165">no</text>
<path class="edge" d="M515,208 L515,268 L678,268" marker-end="url(#ma)"/>
<text class="t-accent" x="528" y="260">no</text>
<path class="edge" d="M610,173 L678,173" marker-end="url(#ma)"/>
<text class="t-accent" x="632" y="165">yes</text>
<path class="edge" d="M775,138 L775,90 L918,90" marker-end="url(#ma)"/>
<text class="t-accent" x="785" y="110">yes</text>
<path class="edge" d="M870,173 L1000,173 L1000,238" marker-end="url(#ma)"/>
<text class="t-accent" x="1010" y="215">no</text>
</svg>
